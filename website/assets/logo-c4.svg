<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80">
  <defs>
    <linearGradient id="cg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="300" height="80" fill="#080C18"/>

  <circle cx="40" cy="40" r="30" fill="none" stroke="url(#cg)" stroke-width="2" filter="url(#glow)"/>

  <text
    x="40" y="36"
    font-size="16" font-weight="800"
    font-family="'Plus Jakarta Sans', sans-serif"
    fill="white" text-anchor="middle">OLA</text>

  <path
    d="M 25,51 C 30,44 36,44 40,51 C 44,58 50,58 55,51"
    stroke="#F97316" stroke-width="1.5" fill="none"
    stroke-linecap="round" stroke-linejoin="round"/>

  <text
    x="80" y="38"
    font-size="36" font-weight="800"
    font-family="'Plus Jakarta Sans', sans-serif"
    fill="white">OLA</text>

  <text
    x="80" y="55"
    font-size="11" font-weight="600"
    font-family="Inter, sans-serif"
    letter-spacing="5" fill="#38BDF8">DIGITAL</text>
</svg>