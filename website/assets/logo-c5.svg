<svg viewBox="0 0 240 88" xmlns="http://www.w3.org/2000/svg" width="240" height="88">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&amp;family=Inter:wght@400&amp;display=swap');</style>
  </defs>
  <!-- Hexagon subtle glow layer -->
  <polygon points="78,44 61,14.56 27,14.56 10,44 27,73.44 61,73.44"
           fill="none" stroke="#0EA5E9" stroke-width="6" stroke-opacity="0.15" stroke-linejoin="round"/>
  <!-- Hexagon main outline -->
  <polygon points="78,44 61,14.56 27,14.56 10,44 27,73.44 61,73.44"
           fill="none" stroke="#0EA5E9" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- OLA text inside hexagon -->
  <text x="44" y="52"
        font-family="'Plus Jakarta Sans', 'Jakarta Sans', sans-serif"
        font-size="20" font-weight="800"
        fill="#0EA5E9" text-anchor="middle">OLA</text>
  <!-- Single-hump wave inside hex below OLA -->
  <path d="M 30,66 Q 44,56 58,66"
        fill="none" stroke="#F97316" stroke-width="2" stroke-linecap="round"/>
  <!-- Wordmark: OLA -->
  <text x="90" y="52"
        font-family="'Plus Jakarta Sans', 'Jakarta Sans', sans-serif"
        font-size="28" font-weight="800"
        fill="#0F172A">OLA</text>
  <!-- Wordmark: Digital -->
  <text x="150" y="52"
        font-family="'Inter', 'Helvetica Neue', sans-serif"
        font-size="18" font-weight="400"
        fill="#64748B">Digital</text>
  <!-- Thin rule below wordmark -->
  <line x1="90" y1="58" x2="224" y2="58" stroke="#E2E8F0" stroke-width="1"/>
</svg>