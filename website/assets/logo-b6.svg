<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80">
  <defs>
    <linearGradient id="olaGrad" x1="0" y1="14" x2="0" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="textGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="lineGlow" x="-5%" y="-600%" width="110%" height="1300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="80" fill="#0A0118"/>

  <!-- Converging perspective radial lines from vanishing point -->
  <line x1="150" y1="54" x2="0"   y2="80" stroke="#4F46E5" stroke-width="0.5" opacity="0.28"/>
  <line x1="150" y1="54" x2="50"  y2="80" stroke="#4F46E5" stroke-width="0.5" opacity="0.28"/>
  <line x1="150" y1="54" x2="100" y2="80" stroke="#4F46E5" stroke-width="0.5" opacity="0.28"/>
  <line x1="150" y1="54" x2="150" y2="80" stroke="#4F46E5" stroke-width="0.5" opacity="0.28"/>
  <line x1="150" y1="54" x2="200" y2="80" stroke="#4F46E5" stroke-width="0.5" opacity="0.28"/>
  <line x1="150" y1="54" x2="250" y2="80" stroke="#4F46E5" stroke-width="0.5" opacity="0.28"/>
  <line x1="150" y1="54" x2="300" y2="80" stroke="#4F46E5" stroke-width="0.5" opacity="0.28"/>

  <!-- Horizontal perspective grid lines — opacity decreasing bottom → top -->
  <line x1="0" y1="79" x2="300" y2="79" stroke="#4F46E5" stroke-width="1" opacity="0.70"/>
  <line x1="0" y1="74" x2="300" y2="74" stroke="#4F46E5" stroke-width="1" opacity="0.54"/>
  <line x1="0" y1="69" x2="300" y2="69" stroke="#4F46E5" stroke-width="1" opacity="0.40"/>
  <line x1="0" y1="65" x2="300" y2="65" stroke="#4F46E5" stroke-width="1" opacity="0.28"/>
  <line x1="0" y1="61" x2="300" y2="61" stroke="#4F46E5" stroke-width="1" opacity="0.18"/>
  <line x1="0" y1="58" x2="300" y2="58" stroke="#4F46E5" stroke-width="1" opacity="0.10"/>
  <line x1="0" y1="56" x2="300" y2="56" stroke="#4F46E5" stroke-width="1" opacity="0.05"/>

  <!-- OLA — bold synthwave gradient with glow -->
  <text
    x="150"
    y="48"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', sans-serif"
    font-size="46"
    font-weight="800"
    fill="url(#olaGrad)"
    filter="url(#textGlow)">OLA</text>

  <!-- Thin glowing cyan separator line -->
  <line
    x1="62" y1="54"
    x2="238" y2="54"
    stroke="#38BDF8"
    stroke-width="1"
    opacity="0.6"
    filter="url(#lineGlow)"/>

  <!-- DIGITAL — tracked cyan label -->
  <text
    x="150"
    y="70"
    text-anchor="middle"
    font-family="'Inter', sans-serif"
    font-size="11"
    font-weight="600"
    letter-spacing="6"
    fill="#38BDF8">DIGITAL</text>
</svg>