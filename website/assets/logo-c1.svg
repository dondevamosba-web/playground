<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80">
  <defs>
    <linearGradient id="olaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <filter id="horizonGlow" x="-5%" y="-300%" width="110%" height="700%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="olaGlow" x="-15%" y="-40%" width="130%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="80" fill="#050A14"/>

  <!-- Scan-lines below horizon -->
  <line x1="0" y1="65" x2="300" y2="65" stroke="#1E3A5F" stroke-width="0.5" opacity="0.4"/>
  <line x1="0" y1="69" x2="300" y2="69" stroke="#1E3A5F" stroke-width="0.5" opacity="0.4"/>
  <line x1="0" y1="73" x2="300" y2="73" stroke="#1E3A5F" stroke-width="0.5" opacity="0.4"/>

  <!-- Horizon line with glow -->
  <line x1="0" y1="60" x2="300" y2="60" stroke="#38BDF8" stroke-width="1.5" filter="url(#horizonGlow)"/>

  <!-- OLA text with gradient and glow -->
  <text
    x="150"
    y="53"
    text-anchor="middle"
    dominant-baseline="auto"
    font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif"
    font-size="46"
    font-weight="800"
    fill="url(#olaGrad)"
    filter="url(#olaGlow)"
  >OLA</text>

  <!-- DIGITAL text -->
  <text
    x="147"
    y="74"
    text-anchor="middle"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="10"
    font-weight="600"
    letter-spacing="7"
    fill="#38BDF8"
  >DIGITAL</text>
</svg>