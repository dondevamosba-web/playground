<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Ola Digital — señal 03</title>
<style>
  @font-face{
    font-family:'Inter';
    src:url('fonts/Inter-Variable.woff2') format('woff2-variations'), url('fonts/Inter-Variable.woff2') format('woff2');

  h1 span{color:#0EA5E9}
  .foot{display:flex;justify-content:space-between;align-items:center}
  .handle{font-size:18px;font-weight:600;opacity:.55}
  .cta{display:inline-flex;align-items:center;padding:18px 36px;border-radius:999px;
    font-size:22px;font-weight:700;background:#0F172A;color:#fff}
</style></head><body>
<div class="poster">
  <div class="eyebrow">Señal 03</div>
  <h1>Subís fotos<br>no sumás<br><span>clientes.</span></h1>

</body></html>
