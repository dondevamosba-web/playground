<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0F172A; }
  .poster {
    position: absolute; top: 0; left: 0;
    width: 1024px; height: 1024px;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 35% 30%, #172033 0%, #0F172A 70%);
    font-family: "Segoe UI", sans-serif;
  }
  .dot { width: 220px; height: 220px; border-radius: 50%; background: #0EA5E9; }
</style>
</head>
<body>
  <div class="poster">
    <div class="dot"></div>
  </div>
</body>
</html>
