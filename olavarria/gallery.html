<style>
  :root { --bg:#14110f; --card:#1f1a17; --accent:#d4a373; --text:#f1ece6; --muted:#9a8f85; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font-family:Georgia,'Times New Roman',serif; padding:48px 24px; }
  header { text-align:center; margin-bottom:48px; }
  h1 { font-size:2.4rem; letter-spacing:.02em; }
  header p { color:var(--muted); margin-top:8px; font-style:italic; }
  .room { max-width:1200px; margin:0 auto 56px; background:var(--card); border-radius:14px; padding:28px; }
  .room h2 { color:var(--accent); font-size:1.4rem; margin-bottom:4px; }
  .room .meta { color:var(--muted); font-size:.9rem; margin-bottom:18px; }
  h3 { color:var(--muted); font-size:.85rem; text-transform:uppercase; letter-spacing:.14em; margin:18px 0 8px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(380px,1fr)); gap:14px; }
  figure { margin:0; }
  figure a { display:block; }
  figure img { width:100%; border-radius:10px; display:block; aspect-ratio:4/3; object-fit:cover; background:#2a241f;
               transition:opacity .15s; }
  figure a:hover img { opacity:.85; }
  figure.plano svg { width:100%; height:auto; display:block; }
  .empty { border:2px dashed #3a322b; border-radius:10px; aspect-ratio:4/3;
           display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:.85rem; }
  footer { text-align:center; color:var(--muted); font-size:.85rem; }
  .hint { text-align:center; color:var(--muted); font-size:.85rem; margin-bottom:10px; }
  #barra { text-align:center; margin-bottom:30px; }
  #barra button { background:var(--accent); border:0; border-radius:8px; padding:8px 16px; font-family:inherit; font-size:.95rem; cursor:pointer; }
  #aviso { color:#9c8; font-size:.85rem; margin-left:10px; }
  figure { position:relative; }
  .mark { position:absolute; top:8px; right:8px; z-index:2; background:rgba(0,0,0,.55); color:#fff;
          border:0; border-radius:50%; width:30px; height:30px; cursor:pointer; font-size:.9rem; }
  .mark:hover { background:#c0392b; }
  figure.marcada img { opacity:.35; outline:3px solid #c0392b; outline-offset:-3px; }
  figure.marcada .mark { background:#c0392b; }
</style>

const thumb = id => `https://drive.google.com/thumbnail?id=${id}&sz=w1600`;
const full  = id => `https://drive.google.com/thumbnail?id=${id}&sz=w4000`;
const fig = (id, nombre) =>
  `<figure data-id="${id}" data-desc="${nombre}"><button class="mark" title="Marcar para eliminar">✕</button><a href="${full(id)}" target="_blank"><img src="${thumb(id)}" alt="${nombre}" loading="lazy"></a></figure>`;

const SLOTS = [["antes","Antes"],["render","Render"],["despues","Después"]];
document.getElementById("rooms").innerHTML = AMBIENTES.map(a => `
  <section class="room">
    <h2>${a.nombre}</h2>
    <div class="meta">${a.nota || "&nbsp;"}</div>
    ${SLOTS.map(([key,label]) => a[key].length
      ? `<h3>${label}</h3><div class="grid">${a[key].map(id => fig(id, a.nombre+" — "+label)).join("")}</div>`
      : `<h3>${label}</h3><div class="grid"><div class="empty">pendiente</div></div>`
    ).join("")}
  </section>`).join("");

// Marcar fotos para eliminar
document.addEventListener("click", e => {
  if (!e.target.classList.contains("mark")) return;
  const f = e.target.closest("figure");
  f.classList.toggle("marcada");
  const key = "del_" + f.dataset.id;
  f.classList.contains("marcada") ? localStorage.setItem(key, f.dataset.desc) : localStorage.removeItem(key);
  actualizarBarra();
});
function actualizarBarra() {
  const n = Object.keys(localStorage).filter(k => k.startsWith("del_")).length;
  document.getElementById("nmarcadas").textContent = n;
}
function copiarMarcadas() {
  const lista = Object.entries(localStorage).filter(([k]) => k.startsWith("del_"))
    .map(([k,v]) => `${v} (id: ${k.slice(4)})`).join("\n");
  navigator.clipboard.writeText(lista || "(ninguna marcada)").then(() =>
    document.getElementById("aviso").textContent = "¡Copiado! Pegáselo a Claude en el chat.");
}
// restaurar marcas guardadas
new MutationObserver(() => {}).observe(document.body, {});
document.querySelectorAll("figure[data-id]").forEach(f => {
  if (localStorage.getItem("del_" + f.dataset.id)) f.classList.add("marcada");
});
actualizarBarra();
</script>
