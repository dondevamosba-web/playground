<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storm Digital — 03 · Testimonial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="storm-kit.css">
</head>
<body>
  <div class="stage">
    <!-- ===== 03 · TESTIMONIAL ===== -->
    <div class="post" data-screen-label="03 Testimonial">

      <div class="wordmark">
        <svg width="17" height="23" viewBox="0 0 17 23" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M10.5 0L0 13h6.2l-2.4 10L17 8.5H9.3L12 0z" fill="#c2ef4e"/>
        </svg>
        <span class="name"><b>Storm</b>&nbsp;<span>Digital</span></span>
      </div>

      <div style="position:absolute; left:64px; right:64px; top:212px;">
        <div class="eyebrow">Client Story</div>

        <!-- Big open-quote glyph -->
        <div style="font-family:var(--font-display); font-weight:700; font-size:150px; line-height:0.6; color:var(--accent-violet); height:78px; margin-top:30px;">&ldquo;</div>

        <div class="display" style="font-size:53px; line-height:1.22; font-weight:500; max-width:880px; margin-top:18px;">
          We stopped paying for <span class="chip">tire-kickers</span> and started booking real roofs. Storm cut our cost per lead by two-thirds in a single quarter.
        </div>

        <!-- Attribution -->
        <div style="display:flex; align-items:center; gap:18px; margin-top:54px;">
          <div style="width:60px; height:60px; border-radius:9999px; background:var(--surface-night); border:1px solid var(--hairline-violet); display:flex; align-items:center; justify-content:center; font-family:var(--font-code); font-size:18px; color:var(--on-dark-muted);">MW</div>
          <div>
            <div style="font-family:var(--font-ui); font-weight:600; font-size:20px; color:#fff;">Marcus Webb</div>
            <div class="body" style="font-size:16px; margin-top:3px;">Owner · Summit Roofing Co.</div>
          </div>
        </div>
      </div>

      <!-- Mascot: speech bubble -->
      <div class="mascot" style="top:128px; right:46px; transform:rotate(7deg);">
        <svg width="150" height="132" viewBox="0 0 130 112" xmlns="http://www.w3.org/2000/svg">
          <path d="M16 6 H114 a14 14 0 0 1 14 14 V70 a14 14 0 0 1 -14 14 H52 L30 106 L34 84 H16 a14 14 0 0 1 -14 -14 V20 a14 14 0 0 1 14 -14 Z" class="pink ink"/>
          <circle cx="44" cy="45" r="7" class="night"/>
          <circle cx="65" cy="45" r="7" class="night"/>
          <circle cx="86" cy="45" r="7" class="night"/>
        </svg>
      </div>

      <svg class="squiggle" viewBox="0 0 952 16" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 8 q 20 -7 40 0 q 20 7 40 0 q 20 -7 40 0 q 20 7 40 0 q 20 -7 40 0 q 20 7 40 0 q 20 -7 40 0 q 20 7 40 0 q 20 -7 40 0 q 20 7 40 0 q 20 -7 40 0 q 20 7 40 0 q 20 -7 40 0 q 20 7 40 0 q 20 -7 40 0 q 20 7 40 0 q 20 -7 40 0 q 20 7 40 0 q 20 -7 40 0 q 20 7 40 0 q 20 -7 40 0 q 20 7 40 0 q 20 -7 40 0 q 20 7 40 0"/>
      </svg>

      <div class="mark-num">03 / 05</div>
      <div class="mark-url">storm.mkt.agency</div>

    </div>
  </div>

  <script>
    function fit(){
      var p = document.querySelector('.post');
      var s = Math.min(window.innerWidth/1080, window.innerHeight/1080);
      p.style.transform = 'scale('+s+')';
    }
    window.addEventListener('resize', fit); fit();
  </script>
</body>
</html>
