<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storm Digital — 09 · Free Audit CTA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="storm-kit.css">
</head>
<body>
  <div class="stage">
    <div class="post" data-screen-label="09 Free Audit">

      <div class="wordmark">
        <svg width="17" height="23" viewBox="0 0 17 23" fill="none">
          <path d="M10.5 0L0 13h6.2l-2.4 10L17 8.5H9.3L12 0z" fill="#c2ef4e"/>
        </svg>
        <span class="name"><b>Storm</b>&nbsp;<span>Digital</span></span>
      </div>

      <!-- Big headline block -->
      <div style="position:absolute; left:64px; right:64px; top:310px;">
        <div class="eyebrow">Free Audit</div>
        <div class="rule" style="width:108px; margin:28px 0 30px;"></div>

        <div class="display" style="font-size:104px; line-height:1.0; font-weight:600; letter-spacing:-0.03em;">
          15 minutes.<br>No pitch.<br>Just the <span class="chip">truth</span>.
        </div>

        <div class="body" style="font-size:21px; line-height:1.5; max-width:680px; margin-top:40px;">
          We'll show you exactly where your pipeline is leaking online — Google Ads waste, GBP gaps, site conversion killers. Then you decide if you want us to fix it.
        </div>

        <!-- CTA row -->
        <div style="display:flex; align-items:center; gap:28px; margin-top:48px;">
          <div style="background:var(--accent-lime); color:var(--ink-deep); font-family:var(--font-ui); font-weight:700; font-size:18px; padding:18px 40px; border-radius:10px; letter-spacing:-0.01em; white-space:nowrap;">
            DM us "AUDIT" →
          </div>
          <div class="body" style="font-size:16px; line-height:1.4;">No contract.<br>No commitment.</div>
        </div>
      </div>

      <!-- Mascot: magnifying glass -->
      <div class="mascot" style="top:124px; right:46px; transform:rotate(-8deg);">
        <svg width="164" height="180" viewBox="0 0 120 134" xmlns="http://www.w3.org/2000/svg">
          <!-- Handle -->
          <line x1="82" y1="92" x2="112" y2="126" stroke="#c2ef4e" stroke-width="14" stroke-linecap="round"/>
          <line x1="82" y1="92" x2="112" y2="126" stroke="#150f23" stroke-width="7" stroke-linecap="round"/>
          <!-- Glass -->
          <circle cx="52" cy="52" r="44" class="pink ink"/>
          <circle cx="52" cy="52" r="32" class="night"/>
          <!-- Lens gleam -->
          <circle cx="36" cy="36" r="8" fill="rgba(255,255,255,0.18)"/>
        </svg>
      </div>

      <svg class="squiggle" viewBox="0 0 952 16" preserveAspectRatio="none">
        <path d="M0 8 q 20 -7 40 0 q 20 7 40 0 q 20 -7 40 0 q 20 7 40 0 q 20 -7 40 0 q 20 7 40 0 q 20 -7 40 0 q 20 7 40 0 q 20 -7 40 0 q 20 7 40 0 q 20 -7 40 0 q 20 7 40 0 q 20 -7 40 0 q 20 7 40 0 q 20 -7 40 0 q 20 7 40 0 q 20 -7 40 0 q 20 7 40 0 q 20 -7 40 0 q 20 7 40 0 q 20 -7 40 0 q 20 7 40 0 q 20 -7 40 0 q 20 7 40 0"/>
      </svg>

      <div class="mark-num">09 / 09</div>
      <div class="mark-url">storm.mkt.agency</div>
    </div>
  </div>

  <script>
    function fit(){var p=document.querySelector('.post');var s=Math.min(window.innerWidth/1080,window.innerHeight/1080);p.style.transform='scale('+s+')';}
    window.addEventListener('resize',fit);fit();
  </script>
</body>
</html>
