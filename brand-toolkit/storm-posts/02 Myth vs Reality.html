<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storm Digital — 02 · Myth vs Reality</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="storm-kit.css">
</head>
<body>
  <div class="stage">
    <!-- ===== 02 · MYTH vs REALITY ===== -->
    <div class="post" data-screen-label="02 Myth vs Reality">

      <div class="wordmark">
        <svg width="17" height="23" viewBox="0 0 17 23" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M10.5 0L0 13h6.2l-2.4 10L17 8.5H9.3L12 0z" fill="#c2ef4e"/>
        </svg>
        <span class="name"><b>Storm</b>&nbsp;<span>Digital</span></span>
      </div>

      <div style="position:absolute; left:64px; right:64px; top:170px;">
        <div class="eyebrow">Myth vs. Reality</div>
        <div class="display" style="font-size:62px; line-height:1.08; margin-top:26px; max-width:840px;">
          Same market.<br>A <span class="chip">different</span> set of math.
        </div>

        <!-- Comparison -->
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:40px; margin-top:64px; position:relative;">

          <!-- Industry -->
          <div class="card-night" style="padding:36px 36px 40px;">
            <div class="eyebrow" style="font-size:13px; letter-spacing:0.24em; color:rgba(255,255,255,0.45);">Industry Average</div>
            <div class="display" style="font-size:96px; line-height:1; margin-top:20px; color:rgba(255,255,255,0.34);">$120<span style="font-size:46px;">+</span></div>
            <div class="body" style="font-size:17px; margin-top:6px; color:rgba(255,255,255,0.4);">per qualified lead</div>
            <div style="height:1px; background:var(--hairline-violet); margin:26px 0;"></div>
            <div class="body" style="font-size:21px; color:rgba(255,255,255,0.5);"><span style="font-family:var(--font-display); font-weight:600;">4%</span>&nbsp;&nbsp;close rate</div>
          </div>

          <!-- Storm -->
          <div style="padding:36px 36px 40px; background:#251b40; border:1px solid #3a2c63; border-radius:18px;">
            <div class="eyebrow" style="font-size:13px; letter-spacing:0.24em; color:#fff;">Storm Clients</div>
            <div class="display" style="font-size:96px; line-height:1; margin-top:20px; color:#fff;">$38</div>
            <div class="body" style="font-size:17px; margin-top:6px; color:var(--on-dark-muted);">per qualified lead</div>
            <div style="height:1px; background:#3a2c63; margin:26px 0;"></div>
            <div style="font-family:var(--font-ui); font-size:21px; color:#fff;"><span style="font-family:var(--font-display); font-weight:600;">11%</span>&nbsp;&nbsp;close rate</div>
          </div>

          <!-- VS pip -->
          <div style="position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:62px; height:62px; border-radius:9999px; background:var(--surface-night); border:1px solid var(--hairline-violet); display:flex; align-items:center; justify-content:center; font-family:var(--font-code); font-size:16px; letter-spacing:0.08em; color:var(--on-dark-muted);">VS</div>
        </div>
      </div>

      <!-- Mascot: lightning bolt -->
      <div class="mascot" style="top:150px; right:40px; transform:rotate(8deg);">
        <svg width="120" height="160" viewBox="0 0 90 120" xmlns="http://www.w3.org/2000/svg">
          <path d="M54 5 L12 66 H40 L30 115 L80 48 H50 L62 5 Z" class="lime ink"/>
        </svg>
      </div>

      <svg class="squiggle" viewBox="0 0 952 16" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 8 q 20 -7 40 0 q 20 7 40 0 q 20 -7 40 0 q 20 7 40 0 q 20 -7 40 0 q 20 7 40 0 q 20 -7 40 0 q 20 7 40 0 q 20 -7 40 0 q 20 7 40 0 q 20 -7 40 0 q 20 7 40 0 q 20 -7 40 0 q 20 7 40 0 q 20 -7 40 0 q 20 7 40 0 q 20 -7 40 0 q 20 7 40 0 q 20 -7 40 0 q 20 7 40 0 q 20 -7 40 0 q 20 7 40 0 q 20 -7 40 0 q 20 7 40 0"/>
      </svg>

      <div class="mark-num">02 / 05</div>
      <div class="mark-url">storm.mkt.agency</div>

    </div>
  </div>

  <script>
    function fit(){
      var p = document.querySelector('.post');
      var s = Math.min(window.innerWidth/1080, window.innerHeight/1080);
      p.style.transform = 'scale('+s+')';
    }
    window.addEventListener('resize', fit); fit();
  </script>
</body>
</html>
