<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storm Digital — 13 · Client Quote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="storm-kit.css">
</head>
<body>
  <div class="stage">
    <div class="post">

      <!-- Wordmark -->
      <div class="wordmark">
        <svg width="17" height="23" viewBox="0 0 17 23" fill="none"><path d="M10.5 0L0 13h6.2l-2.4 10L17 8.5H9.3L12 0z" fill="#c2ef4e"/></svg>
        <span class="name"><b>Storm</b>&nbsp;<span>Digital</span></span>
      </div>

      <!-- Quote mark -->
      <div style="position:absolute; left:58px; top:160px; font-family:var(--font-display); font-size:220px; font-weight:700; line-height:1; color:var(--accent-lime); letter-spacing:-0.06em; user-select:none;">"</div>

      <!-- Quote -->
      <div style="position:absolute; left:64px; right:64px; top:300px;">
        <div class="display" style="font-size:62px; line-height:1.0; letter-spacing:-0.02em; max-width:900px;">
          Went from 4 calls a week<br>to <span class="chip">12 booked jobs</span>.<br>Same budget. 60 days.
        </div>

        <!-- Attribution -->
        <div style="display:flex; align-items:center; gap:18px; margin-top:48px;">
          <div style="width:56px; height:56px; border-radius:9999px; background:var(--accent-lime); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:22px; font-weight:700; color:var(--ink-deep); flex-shrink:0;">T</div>
          <div>
            <div style="font-family:var(--font-ui); font-size:17px; font-weight:600; color:#fff;">Tyler R.</div>
            <div style="font-family:var(--font-ui); font-size:14px; color:var(--on-dark-muted);">HVAC contractor · Phoenix, AZ · Storm client since 2024</div>
          </div>
        </div>
      </div>

      <!-- CTA -->
      <div style="position:absolute; left:64px; bottom:140px;">
        <div style="background:var(--accent-lime); color:var(--ink-deep); font-family:var(--font-ui); font-size:17px; font-weight:700; padding:18px 36px; border-radius:9999px; display:inline-block; letter-spacing:-0.01em;">DM "AUDIT" to get started →</div>
      </div>

      <!-- Squiggle -->
      <svg class="squiggle" viewBox="0 0 952 16" preserveAspectRatio="none">
        <path d="M0 8 q 20 -7 40 0 q 20 7 40 0 q 20 -7 40 0 q 20 7 40 0 q 20 -7 40 0 q 20 7 40 0 q 20 -7 40 0 q 20 7 40 0 q 20 -7 40 0 q 20 7 40 0 q 20 -7 40 0 q 20 7 40 0 q 20 -7 40 0 q 20 7 40 0 q 20 -7 40 0 q 20 7 40 0 q 20 -7 40 0 q 20 7 40 0 q 20 -7 40 0 q 20 7 40 0 q 20 -7 40 0 q 20 7 40 0 q 20 -7 40 0 q 20 7 40 0"/>
      </svg>
      <div class="mark-num">13 / 13</div>
      <div class="mark-url">storm.mkt.agency</div>
    </div>
  </div>
  <script>function fit(){var p=document.querySelector('.post');var s=Math.min(window.innerWidth/1080,window.innerHeight/1080);p.style.transform='scale('+s+')';}window.addEventListener('resize',fit);fit();</script>
</body>
</html>
