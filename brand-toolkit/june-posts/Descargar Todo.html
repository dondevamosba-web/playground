  .row { display:flex; align-items:center; gap:18px; flex-wrap:wrap; margin-bottom:20px; }

  .btn {

    transition:transform .12s ease;
  }
  .btn:hover { transform:translateY(-1px); }
  .btn:disabled { opacity:.45; cursor:not-allowed; transform:none; }

  .progress { height:8px; background:#0F172A; border-radius:999px; overflow:hidden; border:1px solid var(--line); }
  .progress > div { height:100%; background:linear-gradient(90deg,var(--blue),#06B6D4); width:0%; transition:width .2s ease; }
  .progress-label { margin-top:10px; font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--muted); letter-spacing:.12em; }
  #status { color:var(--muted); font-size:14px; }

  .section-label {
    font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:12px;
    letter-spacing:.18em; text-transform:uppercase; color:var(--blue);
    padding:16px 0 10px; border-top:1px solid var(--line); margin-top:24px;

  .section-label:first-child { border-top:none; margin-top:0; padding-top:0; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px; }
  .thumb { background:#0F172A; border:1px solid var(--line); border-radius:10px; padding:8px; transition:border-color .2s; }
  .thumb img,.thumb .placeholder { width:100%; border-radius:6px; display:block; background:#0F172A; object-fit:cover; }
  .thumb .placeholder { display:flex; align-items:center; justify-content:center; color:#475569; font-family:'JetBrains Mono',monospace; font-size:11px; }

  .thumb.done { border-color:var(--green); }
  .thumb.active { border-color:var(--blue); }

  .render-stage { position:fixed; top:0; left:-3000px; overflow:hidden; }

// ── DOM refs ──────────────────────────────────────────────────────────────
const stage    = document.getElementById('renderStage');
const allGrids = document.getElementById('allGrids');
const bar      = document.getElementById('bar');
const label    = document.getElementById('progressLabel');
const status   = document.getElementById('status');
const previewBtn = document.getElementById('previewBtn');
const goBtn    = document.getElementById('goBtn');
const root     = ReactDOM.createRoot(stage);

// ── Build section grid structure ─────────────────────────────────────────
let currentSection = null;
let currentGrid    = null;
MANIFEST.forEach((item, i) => {
  if (item.section) {
    const h = document.createElement('div');
    h.className = 'section-label';
    h.textContent = item.section;
    allGrids.appendChild(h);
    currentGrid = document.createElement('div');
    currentGrid.className = 'grid';
    allGrids.appendChild(currentGrid);
  }
  const ar = item.h / item.w;
  const wrap = document.createElement('div');
  wrap.className = 'thumb';
  wrap.id = `thumb-${i}`;
  wrap.innerHTML = `
    <div class="placeholder" style="aspect-ratio:${item.w}/${item.h};">${String(i+1).padStart(3,'0')}</div>
    <div class="name">${item.name}</div>`;
  currentGrid.appendChild(wrap);
});

// ── Render helpers ────────────────────────────────────────────────────────
function renderSlide(i) {
  const { Comp, w, h } = MANIFEST[i];
  stage.style.width  = w + 'px';
  stage.style.height = h + 'px';
  return new Promise(resolve => {
    root.render(<Comp />);
    requestAnimationFrame(() => setTimeout(resolve, 380));
  });
}

async function captureBlob(w, h) {
  return htmlToImage.toBlob(stage, {
    width: w, height: h, pixelRatio: 1,
    cacheBust: true, backgroundColor: '#0A0F1E',
  });
}

async function captureDataUrl(w, h) {
  return htmlToImage.toPng(stage, {
    width: w, height: h, pixelRatio: 0.28,
    cacheBust: false, backgroundColor: '#0A0F1E',
  });
}

// ── Preview ───────────────────────────────────────────────────────────────
async function buildPreviews() {
  previewBtn.disabled = true;
  goBtn.disabled = true;
  status.textContent = 'Generando previews…';
  for (let i = 0; i < TOTAL; i++) {
    const { name, w, h } = MANIFEST[i];
    await renderSlide(i);
    const url = await captureDataUrl(w, h);
    const t = document.getElementById(`thumb-${i}`);
    t.innerHTML = `<img src="${url}" style="aspect-ratio:${w}/${h};" alt="${name}" /><div class="name">${name}</div>`;
    bar.style.width = ((i+1)/TOTAL*100) + '%';
    label.textContent = `previews ${i+1} / ${TOTAL}`;
  }
  bar.style.width = '0%';
  label.textContent = `0 / ${TOTAL}`;
  status.textContent = `Listo — ${TOTAL} piezas. Cliqueá para descargar el ZIP a resolución completa.`;
  goBtn.disabled = false;
  root.render(<></>);
}

// ── Download ZIP ──────────────────────────────────────────────────────────
goBtn.addEventListener('click', async () => {
  goBtn.disabled = true;
  previewBtn.disabled = true;
  const zip = new JSZip();

  // create folders in the ZIP
  const folders = {};
  const getFolder = (name) => {
    if (!folders[name]) folders[name] = zip.folder(name);
    return folders[name];
  };

  let currentFolder = 'logos';
  for (let i = 0; i < TOTAL; i++) {
    const { name, w, h, section } = MANIFEST[i];
    if (section) {
      if (section.startsWith('Logos · variantes'))   currentFolder = 'logos';
      else if (section.startsWith('Feed posts · tanda 1')) currentFolder = 'feed-posts';
      else if (section.startsWith('Feed posts · tanda 2')) currentFolder = 'feed-posts';
      else if (section.startsWith('Carrusel A'))     currentFolder = 'carruseles';
      else if (section.startsWith('Carrusel B'))     currentFolder = 'carruseles';
      else if (section.startsWith('Carrusel C'))     currentFolder = 'carruseles';
      else if (section.startsWith('Carrusel D'))     currentFolder = 'carruseles';
      else if (section.startsWith('Reel'))           currentFolder = 'reels';
      else if (section.startsWith('Stories'))        currentFolder = 'stories';
      else if (section.startsWith('Email'))          currentFolder = 'email-headers';
      else if (section.startsWith('Motion'))         currentFolder = 'motion-spec';
      else if (section.startsWith('Junio · Single')) currentFolder = 'junio-singles';
      else if (section.startsWith('Junio · Carrusel 1')) currentFolder = 'junio-carruseles';
      else if (section.startsWith('Junio · Carrusel 2')) currentFolder = 'junio-carruseles';
      else if (section.startsWith('Junio · Carrusel 3')) currentFolder = 'junio-carruseles';
      else if (section.startsWith('Junio · Carrusel 4')) currentFolder = 'junio-carruseles';
      else if (section.startsWith('Junio · Carrusel 5')) currentFolder = 'junio-carruseles';
      else if (section.startsWith('Junio · Carrusel 6')) currentFolder = 'junio-carruseles';
      else if (section.startsWith('Julio'))          currentFolder = 'julio-singles';
    }

    // mark active
    document.getElementById(`thumb-${i}`)?.classList.add('active');
    await renderSlide(i);
    const blob = await captureBlob(w, h);
    getFolder(currentFolder).file(`${String(i+1).padStart(3,'0')}-${name}.png`, blob);

    // update thumb
    const url = URL.createObjectURL(blob);
    const t = document.getElementById(`thumb-${i}`);
    if (t) {
      t.classList.remove('active');
      t.classList.add('done');
      t.querySelector('img,div.placeholder').src = url;
    }

    bar.style.width = ((i+1)/TOTAL*100) + '%';
    label.textContent = `${i+1} / ${TOTAL} — ${name}`;
  }

  status.textContent = 'Empacando ZIP…';
  const zipBlob = await zip.generateAsync({ type:'blob' }, m => {
    label.textContent = `ZIP ${Math.round(m.percent)}%`;
  });
  saveAs(zipBlob, 'OLA-Digital-brand-assets-completo.zip');
  status.textContent = `✓ ${TOTAL} piezas descargadas. Click para volver a descargar.`;
  goBtn.disabled = false;
  previewBtn.disabled = false;
  root.render(<></>);
});

previewBtn.addEventListener('click', buildPreviews);

// ── Auto-start after fonts settle ────────────────────────────────────────
setTimeout(() => {
  status.textContent = `${TOTAL} piezas listas. Generá previews o descargá directo.`;
  previewBtn.disabled = false;
  goBtn.disabled = false;
}, 800);
</script>
</body>
</html>
