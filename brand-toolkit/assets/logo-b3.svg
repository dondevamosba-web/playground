<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&family=Inter:wght@600&display=swap');
    </style>
    <linearGradient id="olaGrad" x1="4" y1="0" x2="122" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0C4A6E"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>

  <!-- OLA wordmark -->
  <text
    x="4"
    y="54"
    font-family="'Plus Jakarta Sans', sans-serif"
    font-size="56"
    font-weight="800"
    fill="url(#olaGrad)"
    text-anchor="start">OLA</text>

  <!-- Diagonal slash separator between OLA and DIGITAL -->
  <line
    x1="4" y1="67"
    x2="84" y2="56"
    stroke="#F97316"
    stroke-width="2.5"
    stroke-linecap="round"/>

  <!-- DIGITAL subtext -->
  <text
    x="4"
    y="75"
    font-family="'Inter', sans-serif"
    font-size="14"
    font-weight="600"
    letter-spacing="8"
    fill="#94A3B8"
    text-anchor="start">DIGITAL</text>

  <!-- Right edge vertical accent bar -->
  <rect x="195" y="14" width="3" height="40" rx="2" fill="#F97316"/>
</svg>