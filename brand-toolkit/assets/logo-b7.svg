<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100">
  <!-- Diamond shape -->
  <path d="M60,11 L91,42 L60,73 L29,42 Z" fill="none" stroke="#0EA5E9" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- OD monogram centered in diamond -->
  <text x="60" y="43" text-anchor="middle" dominant-baseline="central" font-family="'Plus Jakarta Sans', sans-serif" fill="#0EA5E9">
    <tspan font-size="26" font-weight="800">O</tspan><tspan font-size="18" font-weight="700" baseline-shift="-1">D</tspan>
  </text>

  <!-- OLA DIGITAL label -->
  <text x="60" y="83" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600" letter-spacing="4" fill="#64748B">OLA DIGITAL</text>

  <!-- Wave accent -->
  <path d="M40,93 Q50,87 60,93 Q70,99 80,93" fill="none" stroke="#F97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>