<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 112">
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0C4A6E"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&amp;family=Inter:wght@600&amp;display=swap');
  </style>

  <!-- Shield -->
  <path d="M60,8 C20,8 10,30 10,50 C10,72 35,85 60,92 C85,85 110,72 110,50 C110,30 100,8 60,8 Z" fill="url(#shieldGrad)"/>

  <!-- OLA wordmark -->
  <text x="60" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="white" text-anchor="middle">OLA</text>

  <!-- 2-hump wave centered at y=56 -->
  <path d="M28,56 C34,50 38,50 44,56 C50,62 54,62 60,56 C66,50 70,50 76,56 C82,62 86,62 92,56" stroke="white" stroke-width="2" fill="none" opacity="0.7"/>

  <!-- Thin separator line -->
  <line x1="26" y1="62" x2="94" y2="62" stroke="white" stroke-width="0.8" stroke-opacity="0.3"/>

  <!-- OD monogram -->
  <text x="60" y="74" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="white" fill-opacity="0.5" text-anchor="middle" letter-spacing="3">OD</text>

  <!-- Brand name below shield -->
  <text x="60" y="100" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#64748B" text-anchor="middle" letter-spacing="4">OLA DIGITAL</text>
</svg>