<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Storm — bulletin</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#08090B}
  .poster{position:absolute;top:0;left:0;width:1080px;height:1080px;overflow:hidden;
    background:#08090B;color:#fff;padding:80px;display:flex;flex-direction:column;
    justify-content:space-between}
  .alert{align-self:flex-start;background:#1147E8;padding:15px 32px;
    font-family:Consolas,monospace;font-size:26px;letter-spacing:.2em;text-transform:uppercase}
  .num{font-family:"Franklin Gothic Heavy","Arial Black",Impact,sans-serif;
    font-size:250px;line-height:.8;color:#1147E8;letter-spacing:-.045em}
  h1{font-family:"Franklin Gothic Heavy","Arial Black",Impact,sans-serif;
    font-size:132px;line-height:.9;margin:14px 0 0;text-transform:uppercase;letter-spacing:-.03em}
  .foot{display:flex;justify-content:space-between;
    font-family:Consolas,monospace;font-size:26px;letter-spacing:.16em;color:#6E767F;
    border-top:3px solid #1C2027;padding-top:26px}
</style></head><body>
<div class="poster">
  <div class="alert">Report 08</div>
  <div>
    <div class="num">$38</div>
    <h1>Cost<br>per lead</h1>
  </div>
  <div class="foot"><span>ROOFING &middot; 90 DAYS</span><span>@STORM.MKT.AGENCY</span></div>
</div>
</body></html>
