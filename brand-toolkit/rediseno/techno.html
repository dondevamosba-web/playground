<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Techno — ficha de producto</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#F2F3F5}
  .poster{position:absolute;top:0;left:0;width:1080px;height:1080px;overflow:hidden;
    background:#F2F3F5;color:#101215;padding:82px;display:flex;flex-direction:column;
    justify-content:space-between}
  .tag{font-family:Consolas,monospace;font-size:25px;letter-spacing:.2em;
    color:#6E7681;text-transform:uppercase}
  h1{font-family:Bahnschrift,"Segoe UI",sans-serif;font-weight:700;font-size:118px;
    line-height:.98;margin:0;letter-spacing:-.03em}
  .specs{display:grid;grid-template-columns:1fr 1fr;gap:26px 48px;
    font-family:Consolas,monospace;font-size:30px;
    border-top:3px solid #C9CDD3;border-bottom:3px solid #C9CDD3;padding:32px 0}
  .specs span{color:#6E7681;font-size:24px;letter-spacing:.1em}
  .specs b{font-weight:600;display:block;margin-top:5px}
  .price{font-family:Bahnschrift,"Segoe UI",sans-serif;font-size:66px;font-weight:700;
    letter-spacing:-.02em}
  .foot{display:flex;justify-content:space-between;align-items:flex-end}
</style></head><body>
<div class="poster">
  <div class="tag">Disponible &middot; entrega en 48 h</div>
  <h1>iPhone 16<br>Plus</h1>
  <div class="specs">
    <div><span>PANTALLA</span><b>6.7" OLED</b></div>
    <div><span>CHIP</span><b>A18</b></div>
    <div><span>C&Aacute;MARA</span><b>48 MP</b></div>
    <div><span>BATER&Iacute;A</span><b>26 h video</b></div>
  </div>
  <div class="foot">
    <span class="price">$1.299.000</span>
    <span class="tag">@TECHNO.APPLE.OK</span>
  </div>
</div>
</body></html>
