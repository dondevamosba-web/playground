<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Talento USA — documento de viaje</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#0D1B2E}
  .poster{position:absolute;top:0;left:0;width:1080px;height:1080px;overflow:hidden;
    background:#0D1B2E;color:#E9EDF2;padding:80px;display:flex;flex-direction:column;
    justify-content:space-between}
  .doc{display:flex;justify-content:space-between;
    font-family:Consolas,monospace;font-size:26px;letter-spacing:.2em;color:#6B85A6}
  .zones{display:flex;gap:64px;font-family:Consolas,monospace;font-size:25px;
    letter-spacing:.14em;color:#8FA8C6;margin-bottom:40px}
  .zones b{display:block;font-family:Cambria,Georgia,serif;font-size:64px;
    color:#E9EDF2;font-weight:700;letter-spacing:0;margin-top:6px}
  h1{font-family:Cambria,Georgia,serif;font-weight:700;font-size:92px;line-height:1.06;
    margin:0;letter-spacing:-.01em}
  h1 em{font-style:italic;color:#4FA3E3}
  .foot{display:flex;justify-content:space-between;
    font-family:Consolas,monospace;font-size:26px;letter-spacing:.14em;color:#6B85A6;
    border-top:3px solid #22344B;padding-top:28px}
</style></head><body>
<div class="poster">
  <div class="doc"><span>REG. 0447</span><span>REMOTO</span></div>
  <div>
    <div class="zones">
      <div>BUENOS AIRES<b>14:00</b></div>
      <div>AUSTIN, TX<b>11:00</b></div>
    </div>
    <h1>Tres horas de diferencia.<br><em>Ninguna de vuelo.</em></h1>
  </div>
  <div class="foot"><span>@TALENTO.REMOTO.USA</span><span>POSTULATE</span></div>
</div>
</body></html>
