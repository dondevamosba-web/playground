<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Fiestas — marco final</title>
<!--
  Marco definitivo para @fiestaselectronicasbuenosaires.
  62 px sobre 1350 = 4.6% de la pieza. La barra suma espacio abajo, no tapa el flyer:
  el arte del venue entra completo.

  Para cada posteo se cambian dos cosas: el src de la imagen y el texto de .fecha.
-->
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#0A0A0A}
  .poster{position:absolute;top:0;left:0;width:1080px;height:1350px;overflow:hidden;
    background:#0A0A0A;display:flex;flex-direction:column}
  .art{flex:1;position:relative;overflow:hidden}
  .art img{width:100%;height:100%;object-fit:cover;object-position:center 22%;display:block}
  .bar{height:62px;flex:none;background:#0A0A0A;border-top:3px solid #A96FE8;
    display:flex;justify-content:space-between;align-items:center;padding:0 34px;
    font-family:Consolas,monospace;font-size:21px;letter-spacing:.13em}
  .handle{color:#F2F2F4}
  .fecha{color:#A96FE8}
</style></head><body>
<div class="poster">
  <div class="art"><img src="flyer-real.jpg" alt=""></div>
  <div class="bar">
    <span class="handle">@fiestaselectronicasbuenosaires</span>
    <span class="fecha">08.07 &middot; CLUB AMERIKA</span>
  </div>
</div>
</body></html>
